      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f5f5;
      }

      .bookshelf {
        display: grid;
        grid-template-rows: repeat(4, 1fr); 
        gap: 4px; 
        width: 50%;
        height: 80%;
        background: #997950;
        border: 6px solid #48260d;
        box-sizing: border-box;
        padding: 4px;
      }

      .shelf {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: flex-end; 
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        border-bottom: 6px solid #48260d;
        height: 100%; 
      }

      .book {
        display: flex;
        align-items: flex-end; 
        height: 100%; 
        cursor: grab;
        box-sizing: border-box;
      }

      .book:active {
        cursor: grabbing;
      }

      img {
        height: 100%;
        width: auto;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      h1 {
        text-align: center;
        font-size: 2em;
        margin-bottom: 20px;
        color: #333;
      }
    </style>

    <script>
      const bookshelf = document.getElementById("bookshelf");
      const shelves = Array.from(bookshelf.getElementsByClassName("shelf"));
      let draggedBook = null;
      function loadPositions() {
        const savedOrder = JSON.parse(localStorage.getItem("bookOrder")) || {};
        shelves.forEach((shelf) => {
          const shelfId = shelf.dataset.shelf;
          const booksInShelf = savedOrder[shelfId] || [];

          booksInShelf.forEach((id) => {
            const book = document.querySelector(`.book[data-id="${id}"]`);
            if (book) {
              shelf.appendChild(book);
              book.style.alignSelf = "flex-end"; 
            }
          });
        });
      }

      function savePositions() {
        const order = {};
        shelves.forEach((shelf) => {
          const shelfId = shelf.dataset.shelf;
          const bookIds = Array.from(shelf.children).map(
            (book) => book.dataset.id
          );
          order[shelfId] = bookIds;
        });
        localStorage.setItem("bookOrder", JSON.stringify(order));
      }

      shelves.forEach((shelf) => {
        shelf.addEventListener("dragover", (e) => {
          e.preventDefault();

          const afterElement = getDragAfterElement(shelf, e.clientX);
          if (draggedBook) {
            draggedBook.style.alignSelf = "flex-end"; 
            if (afterElement == null) {
              shelf.appendChild(draggedBook);
            } else {
              shelf.insertBefore(draggedBook, afterElement);
            }
          }
        });

        shelf.addEventListener("drop", () => {
          if (draggedBook) {
            draggedBook.style.alignSelf = "flex-end"; 
          }
          savePositions(); 
        });
      });

      document.querySelectorAll(".book").forEach((book) => {
        book.draggable = true;

        book.addEventListener("dragstart", () => {
          draggedBook = book;
          book.style.alignSelf = "flex-end"; 
          setTimeout(() => {
            book.style.display = "none"; 
          }, 0);
        });

        book.addEventListener("dragend", () => {
          book.style.display = "block"; 
          book.style.alignSelf = "flex-end"; 
          draggedBook = null; 
          savePositions(); 
        });
      });

      function getDragAfterElement(shelf, x) {
        const draggableElements = [
          ...shelf.querySelectorAll('.book:not([style*="display: none"])'),
        ];
        return draggableElements.reduce(
          (closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = x - box.left - box.width / 2;
            if (offset < 0 && offset > closest.offset) {
              return { offset: offset, element: child };
            } else {
              return closest;
            }
          },
          { offset: Number.NEGATIVE_INFINITY }
        ).element;
      }
      loadPositions();
    </script>
